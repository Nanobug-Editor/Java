[package]
name = "nanobug-java-guest"
version = "0.1.34"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The host supplies the public SDK cache through --plugin-cargo; no checkout is linked.
plugin-protocol = { version = "=0.2.0", features = ["guest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[workspace]
exclude = ["native"]
