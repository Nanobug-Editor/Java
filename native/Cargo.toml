[package]
name = "nanobug-java-native"
version = "0.1.35"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
url = "=2.5.8"

[workspace]

[target.'cfg(windows)'.dependencies]
# Match the host's existing Windows bindings; index ownership must not lock snapshot file bytes.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
